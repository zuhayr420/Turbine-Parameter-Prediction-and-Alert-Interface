<svg width="1000" height="580" viewBox="0 0 1000 580" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .txt { font-family: 'Times New Roman', Times, serif; }
      .bold { font-weight: bold; }
    </style>
  </defs>

  <!-- Background App Canvas -->
  <rect width="1000" height="580" fill="#f8fafc"/>

  <!-- Top SCADA Telemetry Bar -->
  <rect x="0" y="0" width="1000" height="50" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="18" y="13" width="24" height="24" rx="2" fill="#0f172a"/>
  <text x="30" y="30" fill="#ffffff" font-size="13" class="txt bold" text-anchor="middle">T</text>
  <text x="52" y="31" fill="#0f172a" font-size="14" class="txt bold" letter-spacing="0.5">TURBINE SCADA OPERATIONAL CONSOLE — THERMAL POWER STATION</text>

  <!-- Indicators on Header -->
  <rect x="760" y="14" width="105" height="22" rx="2" fill="#f1f5f9" stroke="#cbd5e1"/>
  <circle cx="772" cy="25" r="4" fill="#15803d"/>
  <text x="782" y="29" fill="#475569" font-size="10" class="txt bold">BACKEND: ONLINE</text>

  <rect x="875" y="14" width="105" height="22" rx="2" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="885" y="29" fill="#475569" font-size="10" class="txt bold">CLOCK: 14:32:00 UTC</text>

  <!-- KPI Grid (6 Metric Cards) -->
  <!-- Card 1 -->
  <g transform="translate(20, 65)">
    <rect width="150" height="75" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="3" height="75" rx="1" fill="#0f172a"/>
    <text x="12" y="20" fill="#475569" font-size="10" class="txt bold" letter-spacing="0.5">ACTIVE TURBINES</text>
    <text x="12" y="48" fill="#0f172a" font-size="22" class="txt bold">4 / 4</text>
    <text x="12" y="65" fill="#64748b" font-size="10" class="txt">Online generators</text>
  </g>

  <!-- Card 2 -->
  <g transform="translate(182, 65)">
    <rect width="150" height="75" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="3" height="75" rx="1" fill="#15803d"/>
    <text x="12" y="20" fill="#475569" font-size="10" class="txt bold" letter-spacing="0.5">RUNNING NORMAL</text>
    <text x="12" y="48" fill="#15803d" font-size="22" class="txt bold">3</text>
    <text x="12" y="65" fill="#64748b" font-size="10" class="txt">Within safe limits</text>
  </g>

  <!-- Card 3 -->
  <g transform="translate(344, 65)">
    <rect width="150" height="75" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="3" height="75" rx="1" fill="#b45309"/>
    <text x="12" y="20" fill="#475569" font-size="10" class="txt bold" letter-spacing="0.5">WARNING UNITS</text>
    <text x="12" y="48" fill="#b45309" font-size="22" class="txt bold">1</text>
    <text x="12" y="65" fill="#64748b" font-size="10" class="txt">Approaching threshold</text>
  </g>

  <!-- Card 4 -->
  <g transform="translate(506, 65)">
    <rect width="150" height="75" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="3" height="75" rx="1" fill="#b91c1c"/>
    <text x="12" y="20" fill="#475569" font-size="10" class="txt bold" letter-spacing="0.5">CRITICAL UNITS</text>
    <text x="12" y="48" fill="#b91c1c" font-size="22" class="txt bold">0</text>
    <text x="12" y="65" fill="#64748b" font-size="10" class="txt">Immediate action req.</text>
  </g>

  <!-- Card 5 -->
  <g transform="translate(668, 65)">
    <rect width="150" height="75" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="3" height="75" rx="1" fill="#cbd5e1"/>
    <text x="12" y="20" fill="#475569" font-size="10" class="txt bold" letter-spacing="0.5">ACTIVE ALERTS</text>
    <text x="12" y="48" fill="#0f172a" font-size="22" class="txt bold">1</text>
    <text x="12" y="65" fill="#64748b" font-size="10" class="txt">0 Critical | 1 Warning</text>
  </g>

  <!-- Card 6 -->
  <g transform="translate(830, 65)">
    <rect width="150" height="75" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <rect width="3" height="75" rx="1" fill="#cbd5e1"/>
    <text x="12" y="20" fill="#475569" font-size="10" class="txt bold" letter-spacing="0.5">TELEMETRY PARAMS</text>
    <text x="12" y="48" fill="#0f172a" font-size="22" class="txt bold">24</text>
    <text x="12" y="65" fill="#64748b" font-size="10" class="txt">Continuous polling</text>
  </g>

  <!-- Main Turbines Overview Panel -->
  <g transform="translate(20, 155)">
    <rect width="960" height="215" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <!-- Panel Header -->
    <rect width="960" height="34" rx="2" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="14" y="22" fill="#475569" font-size="11" class="txt bold" letter-spacing="0.5">TURBINE UNITS STATUS OVERVIEW</text>

    <!-- Turbine Card 1 (TG-01) -->
    <g transform="translate(14, 46)">
      <rect width="300" height="155" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
      <rect width="300" height="28" rx="2" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="10" y="18" fill="#0f172a" font-size="12" class="txt bold">TG-01 — Unit 1 Turbine</text>
      <rect x="230" y="6" width="60" height="16" rx="2" fill="rgba(22,163,74,0.12)" stroke="rgba(21,128,61,0.3)"/>
      <text x="260" y="17" fill="#15803d" font-size="9" class="txt bold" text-anchor="middle">NORMAL</text>
      
      <!-- Metrics rows -->
      <text x="10" y="48" fill="#475569" font-size="11" class="txt">Bearing 1 Vibration:</text>
      <text x="285" y="48" fill="#0f172a" font-size="11" class="txt bold" text-anchor="end">2.14 mm/s</text>
      <line x1="10" y1="56" x2="285" y2="56" stroke="#f1f5f9" stroke-width="1"/>

      <text x="10" y="73" fill="#475569" font-size="11" class="txt">Casing Temperature:</text>
      <text x="285" y="73" fill="#0f172a" font-size="11" class="txt bold" text-anchor="end">482.1 °C</text>
      <line x1="10" y1="81" x2="285" y2="81" stroke="#f1f5f9" stroke-width="1"/>

      <text x="10" y="98" fill="#475569" font-size="11" class="txt">Exhaust Steam Pressure:</text>
      <text x="285" y="98" fill="#0f172a" font-size="11" class="txt bold" text-anchor="end">0.086 bar</text>
      <line x1="10" y1="106" x2="285" y2="106" stroke="#f1f5f9" stroke-width="1"/>

      <text x="10" y="123" fill="#475569" font-size="11" class="txt">Active Capacity:</text>
      <text x="285" y="123" fill="#0f172a" font-size="11" class="txt bold" text-anchor="end">500 MW</text>

      <rect x="10" y="132" width="275" height="16" rx="2" fill="#0f172a"/>
      <text x="147" y="143" fill="#ffffff" font-size="9" class="txt bold" text-anchor="middle">VIEW UNIT DETAILS &amp; SCHEMATIC</text>
    </g>

    <!-- Turbine Card 2 (TG-02 Warning) -->
    <g transform="translate(330, 46)">
      <rect width="300" height="155" rx="2" fill="#ffffff" stroke="#b45309" stroke-width="1.5"/>
      <rect width="300" height="28" rx="2" fill="rgba(245,158,11,0.12)" stroke="#b45309"/>
      <text x="10" y="18" fill="#0f172a" font-size="12" class="txt bold">TG-02 — Unit 2 Turbine</text>
      <rect x="230" y="6" width="60" height="16" rx="2" fill="rgba(245,158,11,0.2)" stroke="#b45309"/>
      <text x="260" y="17" fill="#b45309" font-size="9" class="txt bold" text-anchor="middle">WARNING</text>
      
      <!-- Metrics rows -->
      <text x="10" y="48" fill="#475569" font-size="11" class="txt">Bearing 1 Vibration:</text>
      <text x="285" y="48" fill="#b45309" font-size="11" class="txt bold" text-anchor="end">4.18 mm/s ▲</text>
      <line x1="10" y1="56" x2="285" y2="56" stroke="#f1f5f9" stroke-width="1"/>

      <text x="10" y="73" fill="#475569" font-size="11" class="txt">Casing Temperature:</text>
      <text x="285" y="73" fill="#0f172a" font-size="11" class="txt bold" text-anchor="end">512.4 °C</text>
      <line x1="10" y1="81" x2="285" y2="81" stroke="#f1f5f9" stroke-width="1"/>

      <text x="10" y="98" fill="#475569" font-size="11" class="txt">Exhaust Steam Pressure:</text>
      <text x="285" y="98" fill="#0f172a" font-size="11" class="txt bold" text-anchor="end">0.092 bar</text>
      <line x1="10" y1="106" x2="285" y2="106" stroke="#f1f5f9" stroke-width="1"/>

      <text x="10" y="123" fill="#475569" font-size="11" class="txt">3H Forecast Status:</text>
      <text x="285" y="123" fill="#b45309" font-size="11" class="txt bold" text-anchor="end">Breach ETA: 105 min</text>

      <rect x="10" y="132" width="275" height="16" rx="2" fill="#0f172a"/>
      <text x="147" y="143" fill="#ffffff" font-size="9" class="txt bold" text-anchor="middle">EXECUTE 3H XGBOOST FORECAST</text>
    </g>

    <!-- Turbine Card 3 (TG-03) -->
    <g transform="translate(646, 46)">
      <rect width="300" height="155" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
      <rect width="300" height="28" rx="2" fill="#f1f5f9" stroke="#cbd5e1"/>
      <text x="10" y="18" fill="#0f172a" font-size="12" class="txt bold">TG-03 — Unit 3 Turbine</text>
      <rect x="230" y="6" width="60" height="16" rx="2" fill="rgba(22,163,74,0.12)" stroke="rgba(21,128,61,0.3)"/>
      <text x="260" y="17" fill="#15803d" font-size="9" class="txt bold" text-anchor="middle">NORMAL</text>
      
      <!-- Metrics rows -->
      <text x="10" y="48" fill="#475569" font-size="11" class="txt">Bearing 1 Vibration:</text>
      <text x="285" y="48" fill="#0f172a" font-size="11" class="txt bold" text-anchor="end">1.88 mm/s</text>
      <line x1="10" y1="56" x2="285" y2="56" stroke="#f1f5f9" stroke-width="1"/>

      <text x="10" y="73" fill="#475569" font-size="11" class="txt">Casing Temperature:</text>
      <text x="285" y="73" fill="#0f172a" font-size="11" class="txt bold" text-anchor="end">479.0 °C</text>
      <line x1="10" y1="81" x2="285" y2="81" stroke="#f1f5f9" stroke-width="1"/>

      <text x="10" y="98" fill="#475569" font-size="11" class="txt">Exhaust Steam Pressure:</text>
      <text x="285" y="98" fill="#0f172a" font-size="11" class="txt bold" text-anchor="end">0.084 bar</text>
      <line x1="10" y1="106" x2="285" y2="106" stroke="#f1f5f9" stroke-width="1"/>

      <text x="10" y="123" fill="#475569" font-size="11" class="txt">Active Capacity:</text>
      <text x="285" y="123" fill="#0f172a" font-size="11" class="txt bold" text-anchor="end">500 MW</text>

      <rect x="10" y="132" width="275" height="16" rx="2" fill="#0f172a"/>
      <text x="147" y="143" fill="#ffffff" font-size="9" class="txt bold" text-anchor="middle">VIEW UNIT DETAILS &amp; SCHEMATIC</text>
    </g>
  </g>

  <!-- Active Predictive Alerts Table Panel -->
  <g transform="translate(20, 385)">
    <rect width="960" height="175" rx="2" fill="#ffffff" stroke="#cbd5e1"/>
    <!-- Panel Header -->
    <rect width="960" height="32" rx="2" fill="#f1f5f9" stroke="#cbd5e1"/>
    <text x="14" y="21" fill="#475569" font-size="11" class="txt bold" letter-spacing="0.5">ACTIVE PREDICTIVE ALERTS &amp; CMMS DISPATCH LOG</text>

    <!-- Table Header Row -->
    <rect x="0" y="32" width="960" height="26" fill="#f8fafc" stroke="#cbd5e1"/>
    <text x="20" y="49" fill="#475569" font-size="10" class="txt bold">SEVERITY</text>
    <text x="120" y="49" fill="#475569" font-size="10" class="txt bold">TURBINE</text>
    <text x="210" y="49" fill="#475569" font-size="10" class="txt bold">PARAMETER</text>
    <text x="360" y="49" fill="#475569" font-size="10" class="txt bold">CURRENT</text>
    <text x="460" y="49" fill="#475569" font-size="10" class="txt bold">PREDICTED 3H</text>
    <text x="590" y="49" fill="#475569" font-size="10" class="txt bold">BREACH ETA</text>
    <text x="710" y="49" fill="#475569" font-size="10" class="txt bold">DISPATCH STATUS</text>

    <!-- Table Row 1 -->
    <rect x="0" y="58" width="960" height="34" fill="#ffffff" stroke="#f1f5f9"/>
    <rect x="20" y="67" width="65" height="16" rx="2" fill="rgba(245,158,11,0.15)" stroke="rgba(180,83,9,0.3)"/>
    <text x="52" y="78" fill="#b45309" font-size="9" class="txt bold" text-anchor="middle">WARNING</text>
    <text x="120" y="79" fill="#0f172a" font-size="11" class="txt bold">TG-02 (Unit 2)</text>
    <text x="210" y="79" fill="#0f172a" font-size="11" class="txt">Bearing 1 Vibration</text>
    <text x="360" y="79" fill="#475569" font-size="11" class="txt">4.18 mm/s</text>
    <text x="460" y="79" fill="#b45309" font-size="11" class="txt bold">5.42 mm/s</text>
    <text x="590" y="79" fill="#b45309" font-size="11" class="txt bold">In 105 Minutes</text>
    <text x="710" y="79" fill="#15803d" font-size="11" class="txt">Simulated SAP PM WO #49102</text>

    <!-- Table Row 2 (Normal reference) -->
    <rect x="0" y="92" width="960" height="34" fill="#f8fafc" stroke="#f1f5f9"/>
    <rect x="20" y="101" width="65" height="16" rx="2" fill="rgba(22,163,74,0.12)" stroke="rgba(21,128,61,0.3)"/>
    <text x="52" y="112" fill="#15803d" font-size="9" class="txt bold" text-anchor="middle">NORMAL</text>
    <text x="120" y="113" fill="#0f172a" font-size="11" class="txt bold">TG-01 (Unit 1)</text>
    <text x="210" y="113" fill="#0f172a" font-size="11" class="txt">Casing Temperature</text>
    <text x="360" y="113" fill="#475569" font-size="11" class="txt">482.1 °C</text>
    <text x="460" y="113" fill="#15803d" font-size="11" class="txt bold">484.5 °C</text>
    <text x="590" y="113" fill="#64748b" font-size="11" class="txt">No Breach Predicted</text>
    <text x="710" y="113" fill="#64748b" font-size="11" class="txt">Nominal Operations</text>
  </g>
</svg>