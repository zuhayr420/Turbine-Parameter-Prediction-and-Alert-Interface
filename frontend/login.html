<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCADA Login — Turbine Predictive Monitoring System</title>
  <link rel="stylesheet" href="css/scada.css">
  <style>
    *, *::before, *::after {
      font-family: "Times New Roman", Times, serif !important;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      height: 100vh;
      margin: 0;
      padding: 16px;
    }
    .login-container {
      width: 380px;
      max-width: 100%;
      background: #ffffff;
      border: 1px solid var(--border-strong);
      border-radius: 2px;
      box-shadow: 0 2px 8px rgba(15, 23, 42, 0.08);
    }
    .login-header {
      background: #f8fafc;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border-subtle);
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .login-body {
      padding: 20px;
    }
    .plant-subtitle {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <div class="login-header">
      <div style="width:28px; height:28px; background:#0f172a; display:flex; align-items:center; justify-content:center; color:#fff; font-weight:800; border-radius:2px; font-size:14px;">T</div>
      <div>
        <div style="font-size:14px; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; color:var(--text-primary);">Turbine SCADA Console</div>
        <div class="plant-subtitle">Thermal Power Station System</div>
      </div>
    </div>

    <div class="login-body">
      <div id="login-error" style="display:none; background:var(--status-critical-bg); border:1px solid rgba(220,38,38,0.4); color:#b91c1c; font-size:11px; padding:8px 10px; margin-bottom:14px; border-radius:2px;"></div>

      <form id="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label">Username or Station Email</label>
          <input type="text" id="username" class="form-control" placeholder="admin, engineer1, operator1" required autofocus>
        </div>

        <div class="form-group" style="margin-top:12px;">
          <label class="form-label">Authorization Password</label>
          <input type="password" id="password" class="form-control" placeholder="••••••••" required>
        </div>

        <div style="margin-top:14px; margin-bottom:18px; display:flex; justify-content:space-between; align-items:center; font-size:11px; color:var(--text-secondary);">
          <label style="display:flex; align-items:center; gap:6px; cursor:pointer;">
            <input type="checkbox" id="remember">
            <span>Remember terminal</span>
          </label>
          <span style="color:var(--text-muted); font-size:10px; font-weight:bold; letter-spacing:0.04em;">AES-256 / JWT</span>
        </div>

        <button type="submit" class="btn btn-primary" style="width:100%; padding:8px;">Authenticate to Terminal</button>
      </form>

      <div style="margin-top:20px; border-top:1px solid var(--border-subtle); padding-top:12px; font-size:11px; color:var(--text-muted); text-align:center;">
        Administrator Credentials:<br>
        <span class="mono" style="color:var(--text-primary); font-weight:700;">admin / Admin@1234</span>
      </div>
    </div>
  </div>

  <script src="js/api.js"></script>
  <script>
    async function handleLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('login-error');
      errBox.style.display = 'none';

      const u = document.getElementById('username').value.trim();
      const p = document.getElementById('password').value;

      try {
        const res = await ApiClient.login(u, p);
        if (res && res.success) {
          ApiClient.setToken(res.access_token);
          ApiClient.setUser(res.user);
          window.location.href = 'index.html';
        } else {
          errBox.innerText = res?.message || 'Authentication rejected.';
          errBox.style.display = 'block';
        }
      } catch (err) {
        errBox.innerText = err.message || 'Unable to communicate with SCADA backend.';
        errBox.style.display = 'block';
      }
    }
  </script>
</body>
</html>
